<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RoboCap video cover</title>
<!-- 1920x1080 LinkedIn video cover. cover.mjs drives the live app inside the phone and screenshots this page. -->
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; src: url(assets/bricolage-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; src: url(assets/bricolage-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d070b; font-family: "Bricolage Grotesque", "Segoe UI", sans-serif; color: #f7f2f5; }
#cover { position: relative; width: 1920px; height: 1080px; overflow: hidden; background:
  radial-gradient(1000px 800px at 8% 0%, #6a2f53 0%, transparent 60%),
  radial-gradient(1000px 900px at 100% 100%, #4a2370 0%, transparent 62%),
  linear-gradient(160deg, #1b0e17 0%, #0d070b 70%); }
#cover::after { content: ""; position: absolute; inset: 0; opacity: .5; background: radial-gradient(circle, #c0598a55 1.2px, transparent 1.5px) 0 0 / 28px 28px;
  -webkit-mask-image: radial-gradient(70% 70% at 70% 50%, #000, transparent); mask-image: radial-gradient(70% 70% at 70% 50%, #000, transparent); }
.glow { position: absolute; right: 120px; top: 120px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, #c0598a66, transparent); filter: blur(30px); }

.brand { position: absolute; left: 120px; top: 90px; display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 800; letter-spacing: -.02em; z-index: 3; }
.orb { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 34% 30%, #ffd2e8 0%, #d46aa0 38%, #8a3a64 78%); box-shadow: 0 0 40px 4px #c0598a88; }

.copy { position: absolute; left: 120px; top: 270px; width: 1000px; z-index: 3; }
.copy h1 { margin: 0; font-size: 150px; line-height: .98; font-weight: 800; letter-spacing: -.045em; }
.grad { background: linear-gradient(90deg, #fff, #f2add0 55%, #c0598a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.copy p { margin: 44px 0 0; font-size: 44px; line-height: 1.3; font-weight: 500; color: #cdbec8; max-width: 900px; }
.copy p b { color: #fff; font-weight: 700; }
.tags { position: absolute; left: 120px; bottom: 90px; display: flex; gap: 18px; z-index: 3; }
.tags span { padding: 14px 28px; border-radius: 999px; font-size: 30px; font-weight: 700; color: #f2add0; background: #c0598a22; box-shadow: inset 0 0 0 1.5px #c0598a77; }

#phone { position: absolute; left: 1290px; top: 22px; width: 384px; height: 804px; padding: 12px; border-radius: 58px; background: linear-gradient(160deg, #2a2230, #0a080c);
  box-shadow: 0 0 0 2px #ffffff22, 0 0 0 6px #121016, 0 60px 120px -30px #000, 0 0 140px -10px #c0598a88; transform-origin: 50% 0; transform: scale(1.27) rotate(2deg); z-index: 2; }
#phone .screen { width: 360px; height: 780px; border-radius: 46px; overflow: hidden; background: #08090b; position: relative; }
#phone iframe { width: 360px; height: 780px; border: 0; display: block; }
#phone .island { position: absolute; left: 50%; top: 10px; width: 92px; height: 26px; margin-left: -46px; border-radius: 20px; background: #000; z-index: 5; }
</style>
</head>
<body>
<div id="cover">
  <div class="glow"></div>
  <div class="brand"><span class="orb"><svg viewBox="0 0 24 24" width="30" height="30" fill="none"><path d="M12 2c0 0 .8 6.5 3 8.5 2.2 2 7 1.5 7 1.5s-4.8-.5-7 1.5c-2.2 2-3 8.5-3 8.5s-.8-6.5-3-8.5C6.8 11.5 2 12 2 12s4.8.5 7-1.5C11.2 8.5 12 2 12 2Z" fill="currentColor"/></svg></span>RoboCap</div>
  <div class="copy">
    <h1>What if every diner had a <span class="grad">captain?</span></h1>
    <p>An AI ordering assistant for restaurants, <b>built from scratch.</b></p>
  </div>
  <div class="tags"><span>Recommends</span><span>Compares</span><span>Voice-ready</span></div>
  <div id="phone"><div class="island"></div><div class="screen"><iframe id="app" src="http://localhost:4000/"></iframe></div></div>
</div>
</body>
</html>
