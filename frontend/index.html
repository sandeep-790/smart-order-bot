<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>South Indian Cafe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="chat-header-avatar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
          <path d="M17 9h2a2.5 2.5 0 0 1 0 5h-2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M7 4c0 1-1 1-1 2M11 4c0 1-1 1-1 2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="chat-header-info">
        <h1>South Indian Cafe</h1>
        <p>Pure south authentic food</p>
      </div>
      <div class="powered-by">
        <span>Powered by</span>
        <img src="assets/petpooja-logo.png" alt="Petpooja" onerror="this.closest('.powered-by').hidden = true" />
      </div>
    </header>

    <nav class="tab-bar" id="tabBar">
      <button type="button" class="tab-button active" data-tab="chat">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="4" y="8" width="16" height="12" rx="4" stroke="currentColor" stroke-width="2"/>
            <circle cx="9" cy="14" r="1.4" fill="currentColor"/>
            <circle cx="15" cy="14" r="1.4" fill="currentColor"/>
            <line x1="12" y1="8" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="3" r="1.3" fill="currentColor"/>
          </svg>
        </span>
        RoboCap
      </button>
      <button type="button" class="tab-button" data-tab="menu">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 2v8a2 2 0 0 0 2 2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 2v6M9 2v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M17 2c-1.7 0-3 1.8-3 4v4a2 2 0 0 0 2 2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Menu
      </button>
      <button type="button" class="tab-button" data-tab="orders">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 2h12v19l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <line x1="8.5" y1="7" x2="15.5" y2="7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="8.5" y1="11" x2="15.5" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="8.5" y1="15" x2="13" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        Orders
      </button>
    </nav>

    <!-- SmartOrder tab: real AI chat, wired to the same order as the guided UI. -->
    <section class="tab-panel active" id="tab-chat">
      <main class="chat-area" id="chatArea" role="log" aria-live="polite">
        <!-- Messages are inserted here -->
      </main>

      <div class="quick-replies" id="quickReplies" hidden></div>

      <div class="order-locked-banner" id="orderLockedBanner" hidden>
        <p>🎉 Your order has been placed!</p>
        <button type="button" id="startOverButton">Start a new order</button>
      </div>

      <form class="chat-input-bar" id="chatForm">
        <input
          type="text"
          id="chatInput"
          placeholder="Type a message..."
          aria-label="Message"
          autocomplete="off"
        />
        <button type="button" id="micButton" aria-label="Speak your order" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
            <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z" />
          </svg>
        </button>
        <button type="submit" id="sendButton" aria-label="Send message">
          <span class="send-dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <svg class="send-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" />
          </svg>
        </button>
      </form>
    </section>

    <!-- Menu tab: browse real menu.json data, add items to the real order. -->
    <section class="tab-panel" id="tab-menu">
      <div class="panel-scroll" id="menuList">
        <p class="empty-state">Loading menu...</p>
      </div>

      <button type="button" id="categoriesFloatButton" class="categories-float-button" aria-label="Jump to category" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <line x1="4" y1="18" x2="14" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div class="categories-popup" id="categoriesPopup" hidden></div>
    </section>

    <!-- Orders tab: this session's own placed orders. -->
    <section class="tab-panel" id="tab-orders">
      <div class="panel-scroll" id="ordersList">
        <p class="empty-state">No orders yet.</p>
      </div>
    </section>

    <!-- Cart: a pushed view (not a tab) reached via the floating button. -->
    <section class="tab-panel pushed-view" id="view-cart">
      <div class="pushed-view-header">
        <button type="button" class="back-button" id="cartBackButton">← Back</button>
        <h2>Your Cart</h2>
      </div>
      <div class="panel-scroll">
        <div id="cartItems">
          <p class="empty-state">Your cart is empty.</p>
        </div>

        <div class="cart-totals" id="cartTotals" hidden></div>

        <div class="panel-section">
          <div class="panel-section-label">Order note (optional)</div>
          <div class="notes-row">
            <input type="text" id="orderNotesInput" placeholder="e.g. please pack separately" />
            <button type="button" id="saveOrderNotesButton">Save</button>
          </div>
        </div>

        <div class="panel-section" id="promotionsSection" hidden>
          <div class="panel-section-label">Promotions</div>
          <div id="promotionsList"></div>
        </div>

        <div class="panel-section" id="recommendationsSection" hidden>
          <div class="panel-section-label">You might also like</div>
          <div id="recommendationsList"></div>
        </div>
      </div>

      <div class="cart-checkout-bar" id="cartCheckoutBar" hidden>
        <div class="cart-checkout-bar-total">
          <span>Total</span>
          <strong id="cartCheckoutBarTotal">₹0.00</strong>
        </div>
        <button type="button" id="proceedToCheckoutButton" class="primary-button">
          Proceed to Checkout
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Checkout: a pushed view (not a tab). -->
    <section class="tab-panel pushed-view" id="view-checkout">
      <div class="pushed-view-header">
        <button type="button" class="back-button" id="checkoutBackButton">← Back</button>
        <h2>Checkout</h2>
      </div>
      <div class="panel-scroll">
        <div class="panel-section">
          <div class="panel-section-label">Fulfillment</div>
          <div class="fulfillment-toggle">
            <button type="button" class="fulfillment-option active" id="pickupToggle" data-type="pickup">Pickup</button>
            <button type="button" class="fulfillment-option" id="deliveryToggle" data-type="delivery">Delivery</button>
            <button type="button" class="fulfillment-option" id="dineInToggle" data-type="dine_in">Dine-in</button>
          </div>

          <form class="fulfillment-form" id="pickupForm">
            <input type="text" id="pickupName" placeholder="Name for pickup" autocomplete="name" />
            <input type="text" id="pickupTime" placeholder="Pickup time (optional)" />
            <button type="submit">Save pickup details</button>
          </form>

          <form class="fulfillment-form" id="deliveryForm" hidden>
            <input type="text" id="deliveryName" placeholder="Name" autocomplete="name" />
            <input type="tel" id="deliveryPhone" placeholder="Phone number" autocomplete="tel" />
            <input type="text" id="deliveryAddress" placeholder="Full delivery address" autocomplete="street-address" />
            <input type="text" id="deliveryApartment" placeholder="Apartment / unit (optional)" />
            <input type="text" id="deliveryInstructions" placeholder="Delivery instructions (optional)" />
            <button type="submit">Save delivery details</button>
          </form>

          <form class="fulfillment-form" id="dineInForm" hidden>
            <input type="text" id="dineInName" placeholder="Name" autocomplete="name" />
            <input type="tel" id="dineInPhone" placeholder="Phone number" autocomplete="tel" />
            <button type="submit">Save dine-in details</button>
          </form>

          <p class="fulfillment-reply" id="fulfillmentReply" hidden></p>

          <div class="address-confirm" id="addressConfirm" hidden>
            <p id="addressConfirmText"></p>
            <button type="button" id="confirmAddressButton">Confirm address</button>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-label">Review Order</div>
          <button type="button" id="reviewButton">Review order</button>
          <div id="reviewSummary"></div>
        </div>

        <div class="panel-section">
          <button type="button" id="placeOrderButton" class="primary-button" disabled>Place Order</button>
          <p class="checkout-blockers" id="checkoutBlockers" hidden></p>
        </div>

        <div class="order-confirmed" id="orderConfirmed" hidden>
          <p id="orderConfirmedText"></p>
          <button type="button" id="newOrderButton">Start a new order</button>
        </div>
      </div>
    </section>

    <button type="button" id="floatingCartButton" class="floating-cart-button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="9" cy="21" r="1.4" fill="currentColor"/>
        <circle cx="18" cy="21" r="1.4" fill="currentColor"/>
        <path d="M2.5 3h2l2.2 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      View Cart <span class="cart-count" id="floatingCartCount">0</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
