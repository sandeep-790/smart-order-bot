<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeBot — Staff Dashboard</title>
  <link rel="stylesheet" href="staff.css" />
</head>
<body>
  <div id="loginView" class="login-view">
    <form id="loginForm" class="login-form">
      <h1>Staff Login</h1>
      <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" required />
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <p class="login-error" id="loginError" hidden></p>
    </form>
  </div>

  <div id="dashboardView" hidden>
    <header class="staff-header">
      <h1>Staff Dashboard</h1>
      <div class="staff-header-actions">
        <button id="refreshButton" type="button">Refresh</button>
        <button id="logoutButton" type="button">Log out</button>
      </div>
    </header>

    <main id="ordersContainer" class="orders-container">
      <p class="empty-state">Loading orders...</p>
    </main>
  </div>

  <script src="staff.js"></script>
</body>
</html>
